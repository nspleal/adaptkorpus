name: Pacote portátil (Windows)

# Constrói, na nuvem, um pacote portátil do app com o Node EMBUTIDO e publica como
# Release (a ESTRATÉGIA veio do PIRAXIS; o workflow é deste app — usa
# `packaging/portable-launcher.bat` e o `output: 'standalone'` do next.config).
# O autor baixa o .zip, extrai e dá duplo-clique — sem instalar nada.
#
# 🔒 SOB DEMANDA desde 2026-08-08. Antes rodava a CADA push da branch: 120 execuções em
# `windows-latest`, ~3 min cada, e Windows tem multiplicador 2× de minutos — ~824 minutos
# faturáveis empacotando um app que já é servido pela Vercel. A capacidade continua aqui,
# intacta; o que saiu foi o gatilho automático. Custo em regime: zero.
#
# Para gerar um pacote: aba Actions → "Pacote portátil (Windows)" → "Run workflow".
# O Release reusa a tag `portatil-windows`, então o link do autor nunca muda.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portatil-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (saída standalone)
        run: npm run build

      - name: Montar pacote portátil
        shell: pwsh
        run: |
          $dist = "adaptkorpus-portatil"
          Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dist\app","$dist\node" | Out-Null

          # Servidor standalone (Get-ChildItem -Force inclui a pasta .next).
          Get-ChildItem -Path ".next\standalone" -Force |
            Copy-Item -Destination "$dist\app" -Recurse -Force

          # static + public (o standalone não os inclui).
          Copy-Item -Path ".next\static" -Destination "$dist\app\.next\static" -Recurse -Force
          if (Test-Path "public") {
            Copy-Item -Path "public" -Destination "$dist\app\public" -Recurse -Force
          }

          # Node embutido — no Windows o node.exe roda scripts sozinho (1 arquivo).
          Copy-Item (Get-Command node).Source "$dist\node\node.exe"

          # Lançador na raiz do pacote.
          Copy-Item "packaging\portable-launcher.bat" "$dist\INICIAR APP ADAPTKORPUS.bat"

          # Verificação mínima: o build precisa existir dentro do pacote.
          if (-not (Test-Path "$dist\app\.next\BUILD_ID")) {
            throw "Build ausente no pacote (.next/BUILD_ID não encontrado)."
          }

          Compress-Archive -Path "$dist\*" -DestinationPath "adaptkorpus-portatil-windows.zip" -Force
          "Pacote: $((Get-Item adaptkorpus-portatil-windows.zip).Length / 1MB) MB"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portatil-windows
          name: App Adaptkorpus — pacote portátil (Windows)
          body: |
            **Pacote portátil do App Adaptkorpus para Windows — não precisa instalar nada.**

            1. Baixe **adaptkorpus-portatil-windows.zip** abaixo (em *Assets*).
            2. Botão direito no zip → **Extrair tudo**.
            3. Abra a pasta extraída e dê **duplo-clique** em **INICIAR APP ADAPTKORPUS.bat**.

            O app abre sozinho no navegador em http://localhost:3000. Para parar, feche a janela.
            Se aparecer o aviso azul do Windows, clique em *Mais informações → Executar assim mesmo*.

            _Gerado automaticamente a cada atualização do código._
          files: adaptkorpus-portatil-windows.zip
